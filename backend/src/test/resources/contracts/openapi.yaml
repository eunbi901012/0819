      summary: 로그인
      x-related-requirements:
      - REQ-038
      - REQ-057
      - REQ-058
      - REQ-059
      x-business-rules:
      - 상세코드 계층·연계 속성 관리 요청은 R09 세션과 서버 권한 검증을 통과해야 한다
      - 입력 필드는 Requirement Registry의 REQ-038 source-backed 항목만 허용한다
      x-side-effects:
      - 로그인 결과를 관련 로컬 DB 테이블에 저장하고 후속 조회에 반영한다
      - 변경 전후 값, 처리자, 처리일시, 사유를 change_history에 기록할 수 있는 구조로 남긴다
      x-required-tests:
      - '{''happy'': ''유효한 R09 요청 -> 관련 테이블 변경분이 후속 조회에서 확인된다''}'
      - '{''auth'': ''R01 세션 요청 -> 403 ApiError와 데이터 무변경''}'
      - '{''validation'': ''필수 필드 누락 -> 해당 필드 오류가 ApiError.meta에 표시된다''}'
      - '{''business'': ''상세코드 계층·연계 속성 관리의 source-backed 제약 위반 -> 기존 상태가 유지된다''}'
      - '{''side-effect'': ''성공 요청 -> change_history 또는 관련 이력 구조에 처리자와 처리일시가 남는다''}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
