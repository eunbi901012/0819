                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 요청 오류 또는 권한 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      x-business-rules:
      - admin/admin 시드 계정은 로컬 Docker Compose 직후 로그인 가능해야 한다
      x-side-effects:
      - session 레코드를 ACTIVE 상태로 생성한다
      x-required-tests:
      - 'happy: 유효한 로그인 요청 -> 관련 테이블 재조회에서 REQ-030 변경 결과가 확인된다'
      - 'auth: R01 세션으로 로그인 요청 -> 403과 기존 데이터 유지가 확인된다'
      - 'validation: 필수 식별자 누락 -> 400 ApiError.fieldErrors가 반환된다'
      - 'business: admin/admin 시드 계정은 로컬 Docker Compose 직후 로그인 가능해야 한다 위반 -> 400과
        저장 전 상태 유지가 확인된다'
      - 'side-effect: session 레코드를 ACTIVE 상태로 생성한다 -> 변경 후 updated_at 또는 상태 필드가 재조회된다'
      x-state-transitions:
      - none -> ACTIVE
