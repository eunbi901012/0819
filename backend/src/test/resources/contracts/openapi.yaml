      summary: 데이터 범위 규칙 저장
      security:
      - SessionCookieAuth: []
      x-roles: [R09]
      x-related-requirements: [REQ-499, REQ-500, REQ-501, REQ-502, REQ-503, REQ-504, REQ-505, REQ-506, REQ-507, REQ-508, REQ-509, REQ-510, REQ-511]
      x-business-rules: [데이터 범위 유형은 SELF/DEPARTMENT/COLLEGE/BUSINESS_AREA/ALL 중 하나다]
      x-side-effects: [data_scope_rule row 저장 및 change_history 기록]
      x-state-transitions: [기존 범위 규칙 -> 요청 범위 규칙]
      x-required-tests:
      - 'happy: R09 저장 -> data_scope_rule row가 후속 조회에 표시'
      - 'auth: R01 저장 요청 -> 403 ApiError와 data_scope_rule 무변경'
      - 'validation: data_scope_type=INVALID -> data_scope_type field error와 row 미저장'
      - 'business: 메뉴 접근권한 변경 필드 포함 -> menu_permission 변경 없음'
      - 'side-effect: 성공 저장 -> change_history에 entity_name=data_scope_rule 행 존재'
      parameters:
      - name: ruleId
        in: path
        required: true
        schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DataScopeRuleRequest'}}}}
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
        '400': {description: 요청 오류, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: 권한 오류, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/data-scope-evaluations:
    post:
      operationId: evaluateDataScope
      summary: 데이터 범위 판정
      security:
      - SessionCookieAuth: []
      x-roles: [R09]
      x-related-requirements: [REQ-500, REQ-502, REQ-504, REQ-505, REQ-508, REQ-511, REQ-512, REQ-517, REQ-518, REQ-519, REQ-520, REQ-521, REQ-522, REQ-523, REQ-524, REQ-525, REQ-526, REQ-527, REQ-529]
      x-business-rules: [데이터 범위는 화면 필터가 아니라 서버 조회조건에 강제 적용한다]
      x-side-effects: [조회조건 평가 결과를 응답 meta에 반환하며 업무 원천자료는 변경하지 않는다]
      x-state-transitions: [요청 수신 -> 역할별 데이터 범위 판정 -> 서버 조회조건 강제]
      x-required-tests:
      - 'happy: R09 허용 조직 판정 -> ApiResponse.meta.appliedConditions에 조직코드 포함'
      - 'auth: 권한 없는 세션 판정 요청 -> 403 ApiError와 appliedConditions 없음'
      - 'validation: roleCode 누락 -> roleCode field error 반환'
      - 'business: 범위 밖 organization_code 요청 -> 응답 결과에서 해당 organization_code 제외'
      - 'side-effect: 성공 판정 -> 업무 원천 테이블 row count 유지'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DataScopeEvaluationRequest'}}}}
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
        '400': {description: 요청 오류, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: 권한 오류, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
