components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: KNUESESSION
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
    SizeParam:
      name: size
      in: query
      schema:
