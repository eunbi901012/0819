spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://database:5432/aiops}
    username: ${DB_USERNAME:aiops}
    password: ${DB_PASSWORD:aiops}
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  configuration:
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true
server:
  port: 8080
